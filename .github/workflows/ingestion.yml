name: Hourly ingestion

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: jobpulse-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required to run production ingestion."
            exit 1
          fi
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ingest and build analytics
        run: python -m scripts.run_ingestion
