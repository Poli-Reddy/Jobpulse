name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobpulse
          POSTGRES_PASSWORD: jobpulse-test
          POSTGRES_DB: jobpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpulse -d jobpulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobpulse:jobpulse-test@localhost:5432/jobpulse_test
      TEST_DATABASE_URL: postgresql://jobpulse:jobpulse-test@localhost:5432/jobpulse_test
      DBT_HOST: localhost
      DBT_USER: jobpulse
      DBT_PASSWORD: jobpulse-test
      DBT_DATABASE: jobpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create disposable integration database
        env:
          PGPASSWORD: jobpulse-test
        run: createdb --host localhost --username jobpulse jobpulse_test
      - name: Apply database migrations
        run: python -m scripts.run_migrations
      - name: Run tests
        run: pytest -q
      - name: Validate dbt project
        run: dbt parse --project-dir dbt --profiles-dir dbt
