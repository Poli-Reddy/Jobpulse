services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "5050:80"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PYTHONPATH: /opt/jobpulse
    command: ["python", "-m", "scripts.run_migrations"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PYTHONPATH: /opt/jobpulse
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["python", "-m", "scripts.run_api"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobpulse}:${POSTGRES_PASSWORD:-jobpulse-local}@postgres:5432/${POSTGRES_DB:-jobpulse}
      PYTHONPATH: /opt/jobpulse
      LOG_LEVEL: INFO
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-60}
      JOBICY_ENABLED: ${JOBICY_ENABLED:-true}
      JOBICY_BASE_URL: ${JOBICY_BASE_URL:-https://jobicy.com/api/v2/remote-jobs}
      JOBICY_COUNT: ${JOBICY_COUNT:-100}
      JOBICY_GEO: ${JOBICY_GEO:-}
      JOBICY_INDUSTRY: ${JOBICY_INDUSTRY:-engineering}
      ARBEITNOW_ENABLED: ${ARBEITNOW_ENABLED:-true}
      ARBEITNOW_BASE_URL: ${ARBEITNOW_BASE_URL:-https://www.arbeitnow.com/api/job-board-api}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-2}
    command: ["python", "-m", "scripts.run_worker"]

volumes:
  pgdata:
